<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin Login | Dhanvi Finserv</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #103f73, #15549a);
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
            padding: 40px 35px 30px;
            text-align: center;
        }

        .login-card .logo-wrap {
            margin-bottom: 20px;
        }

        .login-card .logo-wrap img {
            max-height: 56px;
        }

        .login-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #103f73;
            margin: 0 0 6px;
        }

        .login-card .subtext {
            font-size: 13px;
            color: #777;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group .input-wrap {
            position: relative;
        }

        .form-group .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 14px;
        }

        .form-group .form-control {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #333;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
            background: #f9fafb;
        }

        .form-group .form-control:focus {
            border-color: #15549a;
            box-shadow: 0 0 0 3px rgba(21, 84, 154, 0.12);
            background: #fff;
        }

        .form-group .form-control::placeholder {
            color: #b0b0b0;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            text-align: left;
        }

        .remember-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            margin: 0;
        }

        .remember-row label input[type="checkbox"] {
            accent-color: #15549a;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .remember-row .forgot-link {
            font-size: 12px;
            color: #A96500;
            text-decoration: none;
            font-weight: 500;
        }

        .remember-row .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: #15549a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease;
            letter-spacing: 0.3px;
        }

        .btn-signin:hover {
            background: #103f73;
        }

        .btn-signin:active {
            transform: scale(0.985);
        }

        .btn-signin i {
            margin-left: 6px;
        }

        .error-msg {
            display: none;
            color: #e14b4b;
            font-size: 13px;
            margin-top: 14px;
            padding: 8px 12px;
            background: #fdf0f0;
            border-radius: 6px;
            text-align: center;
        }

        .error-msg.show {
            display: block;
        }

        .card-footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }

        .card-footer-text a {
            color: #15549a;
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer-text a:hover {
            color: #A96500;
            text-decoration: underline;
        }
    </style>
    <link href="css/loader.css" rel="stylesheet">
    <link href="css/animations.css" rel="stylesheet">
</head>
<body>
    <!-- Page Preloader -->
    <div id="page-loader" class="page-loader" aria-live="polite" role="status">
        <div class="page-loader-inner">
            <div class="loader-logo-area">
                <img src="images/logo.png" alt="Dhanvi Finserv" class="loader-logo" width="160" height="60" onerror="handleDhanviLogoError(this)">
                <div class="loader-logo-fallback">DHANVI FINSERV</div>
            </div>
            <div class="loader-spinner-box">
                <div class="loader-spinner-ring"></div>
            </div>
            <div class="loader-subtitle">Quick &amp; Trusted Financial Solutions</div>
            <div class="loader-shimmer-bar"></div>
        </div>
    </div>
    <script src="js/loader.js"></script>
    <script>setTimeout(function(){var p=document.getElementById('page-loader');if(p){p.classList.add('is-hidden');}},3000);</script>
    <noscript><style>#page-loader { display: none !important; }</style></noscript>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-wrap">
                <img src="images/logo.png" alt="Dhanvi Finserv">
            </div>
            <h2>Admin Dashboard</h2>
            <p class="subtext">Sign in to manage loan applications</p>

            <form id="adminLoginForm" autocomplete="off">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa fa-envelope"></i>
                        <input type="email" class="form-control" id="adminEmail" placeholder="admin@dhanvifinserv.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrap">
                        <i class="fa fa-lock"></i>
                        <input type="password" class="form-control" id="adminPassword" placeholder="Enter password" required>
                    </div>
                </div>

                <div class="remember-row">
                    <label>
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-signin">
                    Sign In <i class="fa fa-arrow-right"></i>
                </button>

                <div class="error-msg" id="errorMsg">
                    <i class="fa fa-exclamation-circle"></i> Invalid email or password
                </div>
            </form>

            <div class="card-footer-text">
                &copy; Dhanvi Finserv | <a href="index.html">Back to website</a>
            </div>
        </div>
    </div>

    <!-- Nhost JS SDK + project configuration -->
    <script src="https://cdn.jsdelivr.net/npm/@nhost/nhost-js@4.9.0/dist/nhost-js.umd.js"></script>
    <script src="js/nhost-client.js"></script>
    <script>
        (function () {
            var form = document.getElementById('adminLoginForm');
            var errorMsg = document.getElementById('errorMsg');
            var submitBtn = form.querySelector('button[type="submit"]');

            function showError(message) {
                errorMsg.innerHTML = '<i class="fa fa-exclamation-circle"></i> ' +
                    String(message || 'Invalid email or password')
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                errorMsg.classList.add('show');
            }

            function hideError() {
                errorMsg.classList.remove('show');
            }

            function setBusy(busy) {
                if (!submitBtn) { return; }
                submitBtn.disabled = busy;
                submitBtn.innerHTML = busy
                    ? '<i class="fa fa-circle-o-notch fa-spin"></i> Signing in…'
                    : 'Sign In <i class="fa fa-arrow-right"></i>';
            }

            // Show the message left by the admin auth guard, if any.
            try {
                var guardMessage = window.sessionStorage.getItem('dhanviAdminLoginMessage');
                if (guardMessage) {
                    window.sessionStorage.removeItem('dhanviAdminLoginMessage');
                    showError(guardMessage);
                }
            } catch (err) { /* sessionStorage may be unavailable */ }

            // If an administrator session is already active, skip the form.
            (async function redirectIfSignedIn() {
                var backend = window.DhanviBackend;
                var nhost = backend && backend.getClient();
                if (!nhost) { return; }
                var session = nhost.getUserSession();
                if (!session || !session.user) { return; }
                if (!Array.isArray(session.user.roles) || session.user.roles.indexOf('admin') === -1) { return; }

                try {
                    var data = await backend.adminGql(
                        'query AdminLoginCheck($userId: uuid!) {' +
                        '  admin_profiles_by_pk(user_id: $userId) { role }' +
                        '}',
                        { userId: session.user.id }
                    );
                    var profile = data && data.admin_profiles_by_pk;
                    if (profile && profile.role === 'admin') {
                        window.location.replace('admin-dashboard.html');
                        return;
                    }
                    await backend.signOut();
                } catch (err) {
                    await backend.signOut();
                }
            })();

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                hideError();

                var email = document.getElementById('adminEmail').value.trim();
                var password = document.getElementById('adminPassword').value;

                var backend = window.DhanviBackend;
                if (!backend) {
                    showError('The secure sign-in service could not be loaded. Please refresh the page.');
                    return;
                }
                var nhost = backend.getClient();
                if (!nhost) {
                    showError('The secure sign-in service is not configured. Please contact the site administrator.');
                    return;
                }

                setBusy(true);
                try {
                    var response = await nhost.auth.signInEmailPassword({
                        email: email,
                        password: password
                    });
                    var body = (response && response.body) || {};

                    if (!body.session) {
                        if (body.mfa) {
                            throw new Error('Multi-factor authentication is enabled for this account. Please sign in with the Nhost dashboard or disable MFA for the admin portal.');
                        }
                        throw new Error('Sign-in did not return a session. Please try again.');
                    }

                    var user = body.session.user;
                    if (!user || !Array.isArray(user.roles) || user.roles.indexOf('admin') === -1) {
                        await backend.signOut();
                        throw new Error('Access denied. This account does not have administrator privileges.');
                    }

                    // Confirm the application-level admin profile row too.
                    var data;
                    try {
                        data = await backend.adminGql(
                            'query AdminLoginGuard($userId: uuid!) {' +
                            '  admin_profiles_by_pk(user_id: $userId) { role }' +
                            '}',
                            { userId: user.id }
                        );
                    } catch (err) {
                        await backend.signOut();
                        console.error('Admin profile lookup failed:', err);
                        throw new Error('Access denied. The administrator profile could not be verified.');
                    }

                    var profile = data && data.admin_profiles_by_pk;
                    if (!profile || profile.role !== 'admin') {
                        console.error('No admin_profiles row or role mismatch:', profile);
                        await backend.signOut();
                        throw new Error('Access denied. The administrator profile could not be verified.');
                    }

                    window.location.href = 'admin-dashboard.html';
                } catch (err) {
                    console.error('Admin sign-in failed:', err);
                    showError(backend.errorMessage(err));
                } finally {
                    setBusy(false);
                }
            });

            ['adminEmail', 'adminPassword'].forEach(function (id) {
                document.getElementById(id).addEventListener('input', hideError);
            });
        })();
    </script>
    <script src="js/interactions.js"></script>
</body>
</html>
